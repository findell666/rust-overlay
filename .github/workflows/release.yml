# Builds the Windows binaries and attaches them to a GitHub release.
#
# Triggered by pushing a tag such as v0.2.0. The item database is committed, so the runner
# does not need Rust installed — it only compiles the icon and packages the app.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Draw the icon
        run: npm run make-icon

      - name: Package
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          draft: true
          generate_release_notes: true
          # A tag carrying a prerelease identifier — v0.0.1-alpha.1 — is marked as such on
          # GitHub, so it never becomes the "latest release" people land on by default.
          prerelease: ${{ contains(github.ref_name, '-') }}
